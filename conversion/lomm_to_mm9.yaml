# lomm_to_mm9.yaml
# =================
#
# Default conversion rules for `conversion/lomm_to_mm9.py`. Each section below
# corresponds to one stage of the conversion pipeline. Add/remove/edit
# entries to teach the converter about new LoMM-only classes, change
# how shared classes are patched, or pick different MM9 templates.
#
# Property `code` values used by the patch_class.add_props section
# (and by the `add_props` and explicit `overrides` forms in
# convert_class / experimental_convert) match the LithTech v66 DAT
# type codes parsed by mm9_patcher:
#     0 = LT string (Pascal string)
#     1 = vec3 (3 floats)        e.g. Pos
#     2 = vec3 (3 floats)        e.g. TintColor
#     3 = float32
#     5 = bool (1 byte)
#     6 = uint32 / LongInt
#     7 = quaternion (4 floats)  e.g. Rotation

# ---------------------------------------------------------------------------
# Stage 3 - Drop unknown classes
# ---------------------------------------------------------------------------
# By default any class not in MM9's catalog.json is removed.  Use
# extra_remove_classes to drop classes that *are* registered in MM9 but
# you still don't want.  Use keep_classes to opt out of removal even
# if a class isn't in the MM9 catalog (e.g. a custom class you've added
# to the game executable).
remove_unknown_classes: true
extra_remove_classes: []
keep_classes: []

# ---------------------------------------------------------------------------
# Stages 4 + 5 - Patch shared classes by adding missing properties.
# ---------------------------------------------------------------------------
# Properties already present on the source object are left alone.  Only
# missing properties are added.  `flags` defaults to 0 if omitted.
patch_class:

  StartPoint:
    add_props:
      MovePlayerToFloor: { code: 5, value: 1 }

  WorldProperties:
    add_props:
      CanSaveGame:     { code: 5, value: 1 }
      CanMiniSaveGame: { code: 5, value: 1 }

# ---------------------------------------------------------------------------
# Stages 6 + 7 - Convert classes by cloning a template.
# ---------------------------------------------------------------------------
# Stage 1 - Convert classes by cloning a template.
# ---------------------------------------------------------------------------
# Each class listed here is replaced with a clone of `template` (looked
# up in MM9 WORLDS.REZ). This stage runs first so retyped objects (e.g.
# Orc -> LizardOrc) survive the drop stage. `preserve` lists fields
# copied from the source; others inherit template values. `new_type`
# retypes the object. `overrides` updates existing template fields;
# `add_props` adds new ones with an explicit `code`.
convert_class:

  TreasureChest:
    template: "WORLDS/1000TERRORS.DAT::TreasureChest4"
    preserve:
      - Name
      - Pos
      - Rotation
      - ScriptName
      - ScriptParams
      - Filename
      - Skin
      - Scale
      - TintColor
      - AttachTo
      - OpenSoundName
      - CloseSoundName
      - TriggerTarget
      - Trigger
      - Locked
      - TriggerOnOpen
      - TriggerOnOpenDone
      - TriggerOnClose
      - TriggerOnCloseDone
      - TriggerCount

  Brazier:
    template: "WORLDS/1000TERRORS.DAT::Brazier46"
    preserve:
      - Name
      - Pos
      - Rotation
      - ScriptName
      - ScriptParams
      - Scale
      - TintColor
      - Filename
      - Skin
      - On
      - SoundRadius
      - Translucency
      - FireOffset

  Fire:
    template: "WORLDS/1000TERRORS.DAT::Brazier46"
    new_type: Brazier
    preserve:
      - Name
      - Pos
      - Rotation
      - ScriptName
      - ScriptParams
      - Scale
      - TintColor
      - Filename
      - Skin
      - On
      - SoundRadius
      - Translucency
      - FireOffset

  # Retype LoMM enemies to MM9 equivalents.
  Orc:
    template: "WORLDS/TRAININGHALL.DAT::OrcStudent1"
    new_type: LizardOrc
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  Goblin:
    template: "WORLDS/TRAININGHALL.DAT::OrcStudent1"
    new_type: LizardOrc
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  LizardMan:
    template: "WORLDS/TRAININGHALL.DAT::OrcStudent1"
    new_type: LizardOrc
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  LizardWarrior:
    template: "WORLDS/TRAININGHALL.DAT::TrainingObserver"
    new_type: LizardOrcWarrior
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  Dwarf:
    template: "WORLDS/DRANGHEIMPRISON.DAT::DwarvenSmith0"
    new_type: DwarvenGuard
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  Soldier:
    template: "WORLDS/DOOKSCASTLE.DAT::HallwaySleeper0"
    new_type: HalfOrcSoldier
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  Mummy:
    template: "WORLDS/CHASMOFTHEDEAD.DAT::PetrifiedMummy7"
    new_type: EmbalmedMummy
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  Wight:
    template: "WORLDS/CHASMOFTHEDEAD.DAT::PetrifiedMummy7"
    new_type: EmbalmedMummy
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  EvilEye:
    template: "WORLDS/1000TERRORS.DAT::Eye20"
    new_type: Eye
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]

  EvilEyeTerror:
    template: "WORLDS/1000TERRORS.DAT::Eye20"
    new_type: Eye
    preserve: [Name, Pos, Rotation, Scale, ScriptName, ScriptParams]
